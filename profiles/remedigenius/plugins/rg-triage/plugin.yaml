name: rg-triage
version: "0.9.2"
description: AWS security triage desk. One read-only tool over the rgtriage CLI, the attention board at session start, /triage and /rate commands, and redacted execution traces for offline improvement.
author: RemediGenius
license: Apache-2.0
homepage: https://github.com/RajaRenga/RemediGenius-CE
requires_hermes: ">=0.23.1"
python_dependencies:
  - remedigenius-community==0.9.2
provides_tools:
  - rg_triage
  - rg_analytics
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - on_skill_lifecycle
  - post_api_request
  - post_llm_call
  - transform_llm_output
capabilities:
  provides_tools:
    - rg_triage
    - rg_analytics
  provides_hooks:
    - pre_llm_call
    - pre_tool_call
    - post_tool_call
    - on_skill_lifecycle
    - post_api_request
    - post_llm_call
    - transform_llm_output
  provides_middleware: []
  requires_env: []
